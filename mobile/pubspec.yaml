name: lawyer_diary_bd
description: "Lawyer Diary BD — বাংলাদেশি আইনজীবীর ডিজিটাল ডায়েরি"
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State & Navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0

  # Local Database (offline-first — local DB is source of truth)
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.2
  path: ^1.9.0

  # Secure storage (tokens, encryption key)
  flutter_secure_storage: ^9.2.2

  # Document scanner (ML Kit) — disabled for debug APK on AGP9 / cross-drive Kotlin incremental
  # TODO: re-enable when plugin supports built-in Kotlin / same-drive pub-cache
  # flutter_doc_scanner: ^0.0.5

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  # workmanager 0.5.2 uses removed Flutter v1 embedding — incompatible with Flutter 3.44 / AGP 9
  # workmanager: ^0.5.2

  # Firebase (FCM + Remote Config) — optional until flutterfire configure
  # Keep commented for low-RAM debug install; stubs work without native Firebase
  # firebase_core: ^3.1.0
  # firebase_messaging: ^15.0.3
  # firebase_remote_config: ^5.0.0

  # AdMob — native + rewarded interstitial (Play-safe; no IAP)
  # TODO: re-add when plugin supports AGP 9 (5.3.1 breaks Gradle configurations.all).
  # google_mobile_ads: ^5.1.0

  # Network
  dio: ^5.4.3+1

  # Biometric app lock
  local_auth: ^2.2.0

  # PDF (client only downloads; generation is server-side)
  # printing pinned old compileSdk — removed for AGP9 debug build until upgraded
  # printing: ^5.13.1

  # Utilities
  intl: ^0.19.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0
  collection: ^1.18.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
        - asset: assets/fonts/RobotoMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/RobotoMono-Bold.ttf
          weight: 700
